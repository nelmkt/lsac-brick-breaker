<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bug Breaker | LSAC</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="wrap">
    <header class="hud">
        <span>Score: <b id="score">0</b></span>
        <span>Lives: <b id="lives">3</b></span>
    </header>

    <div class="stage">
        <canvas id="myCanvas" width="480" height="360"></canvas>

        <div id="overlay" class="overlay">
            <p class="club-tag">LSAC | Learn Student Ambassadors Club</p>
            <h1 id="title">Bug Breaker</h1>
            <p id="subtitle">Break the bricks and don't drop the ball.</p>
            <button id="start">Play</button>
            <p class="hint">Arrow keys or mouse to move</p>
        </div>
    </div>

    <footer class="footer">Made by LSAC for our club events</footer>
</main>

<script src="game.js"></script>
</body>
</html>
